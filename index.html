<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" type="image/png" sizes="32x32" href="icon/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icon/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon/apple-touch-icon.png">
<link rel="manifest" href="icon/site.webmanifest">
<link rel="stylesheet" href="./typography.css">
<link rel="stylesheet" href="./site-ui.css">
<title>近期生日提醒</title>
<style>
  body { padding:32px 16px; }
  h1 { margin:0 0 4px; }
  ul { list-style:none; margin:0; padding:0; }

  li.person { display:flex; align-items:center; gap:14px; padding:12px 0; border-bottom:1px solid var(--line); }
  li.person:last-child { border-bottom:none; }
  .name-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .badge { background:#fff0f3; color:var(--pri); font-size:var(--fs-caption); padding:4px 10px;
           border-radius:2px; white-space:nowrap; }
  .empty { color:var(--sub); font-size:20px; padding:28px 0; text-align:center; }

  li.day { padding:12px 0; border-bottom:1px solid var(--line); }
  li.day:last-child { border-bottom:none; }
  .day-head { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .day-date { font-weight:600; font-size:18px; }
  .day-week { color:var(--sub); font-size:var(--fs-caption); }
  .day-offset { margin-left:auto; background:#fff0f3; color:var(--pri);
                font-size:var(--fs-caption); padding:3px 9px; border-radius:2px; white-space:nowrap; }
  .person-line { display:flex; align-items:center; gap:10px; padding:5px 0; }
  .person-line .name { font-weight:600; }

</style>
</head>
<body>
<div class="page stack">
  <header class="site-head">
    <nav class="site-nav" aria-label="页面导航">
      <a href="./index.html" aria-current="page">最近生日</a>
      <a href="./calendar.html">生日日历</a>
      <a href="./all_birthdays.html">全年一览</a>
    </nav>
    <div id="birthdayFilters"></div>
  </header>

  <div class="card">
    <h1>今天的寿星</h1>
    <p class="subtitle" id="todayLabel"></p>
    <ul id="list"></ul>
  </div>

  <div class="card">
    <h1>未来 15 天生日</h1>
    <p class="subtitle" id="upcomingLabel">明天起</p>
    <ul id="upcomingList"></ul>
  </div>

</div>

<script src="./birthdays.js"></script>
<script src="./contacts.js"></script>
<script src="./birthday-core.js"></script>
<script src="./birthday-filter.js"></script>
<script>
const Core = window.BirthdayCore;
const {
  WEEK_CN,
  escapeHTML,
} = Core;
const UPCOMING_DAYS = 15;

function renderToday(people, today = Core.nowInChina()) {
  const week = WEEK_CN[today.getUTCDay()];
  document.getElementById("todayLabel").textContent =
    `${today.getUTCFullYear()}年${today.getUTCMonth() + 1}月${today.getUTCDate()}日 ` +
    `星期${week}`;

  const list = document.getElementById("list");
  if (!people.length) {
    list.innerHTML = `<li class="empty">今天没有寿星~</li>`;
    return;
  }

  list.innerHTML = people.map(person => {
    const meta = Core.subjectMetaHTML(person);
    return `<li class="person">
      ${Core.avatarHTML(person)}
      <div class="info">
        <div class="name-row">
          <span class="name">${escapeHTML(person.name)}</span>
          <span class="badge">生日快乐 🎉</span>
        </div>
        ${meta ? `<div class="meta">${meta}</div>` : ""}
      </div>
    </li>`;
  }).join("");
}

function offsetText(offset) {
  if (offset === 0) return "今天";
  if (offset === 1) return "明天";
  if (offset === 2) return "后天";
  return `${offset} 天后`;
}

function renderUpcoming(groups) {
  const total = groups.reduce((sum, group) => sum + group.people.length, 0);
  document.getElementById("upcomingLabel").textContent =
    `最近有 ${total} 位寿星`;

  const list = document.getElementById("upcomingList");
  if (!groups.length) {
    list.innerHTML = `<li class="empty">未来 ${UPCOMING_DAYS} 天没有寿星 🍃</li>`;
    return;
  }

  list.innerHTML = groups.map(group => {
    const date = group.date;
    const week = WEEK_CN[date.getUTCDay()];
    const people = group.people.map(person => {
      const meta = Core.subjectMetaHTML(person, { agePrefix: "满 " });
      return `<div class="person-line">
        ${Core.avatarHTML(person, { small: true })}
        <div class="info">
          <div class="name">${escapeHTML(person.name)}</div>
          ${meta ? `<div class="meta">${meta}</div>` : ""}
        </div>
      </div>`;
    }).join("");

    return `<li class="day">
      <div class="day-head">
        <span class="day-date">${date.getUTCMonth() + 1}月${date.getUTCDate()}日</span>
        <span class="day-week">星期${week}</span>
        <span class="day-offset">${offsetText(group.offset)}</span>
      </div>
      ${people}
    </li>`;
  }).join("");
}

function refreshBirthdays() {
  Core.resetAvatars();
  const subjects = window.BirthdayFilters.getSubjects();
  renderToday(Core.findTodaysBirthdays(subjects));
  renderUpcoming(Core.findUpcomingBirthdays(subjects, UPCOMING_DAYS));
}

window.BirthdayFilters.subscribe(refreshBirthdays);
refreshBirthdays();
Core.scheduleChinaMidnightRefresh(refreshBirthdays);
</script>
</body>
</html>
