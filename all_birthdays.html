<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" type="image/png" sizes="32x32" href="icon/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icon/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon/apple-touch-icon.png">
<link rel="manifest" href="icon/site.webmanifest">
<link rel="stylesheet" href="./typography.css">
<link rel="stylesheet" href="./site-ui.css">
<title>全年生日一览</title>
<style>
  body { padding:24px 16px 48px; }

  h1 { margin:0; }

  .month-nav {
    display:flex; flex-wrap:wrap; gap:6px;
    position:sticky; top:0; z-index:10;
    background:var(--bg); padding:10px 0 12px;
  }
  .month-nav a {
    font-size:16px; color:var(--text); text-decoration:none;
    background:#fff; border-radius:2px; padding:6px 13px;
    box-shadow:0 2px 8px rgba(43,45,66,.06);
  }
  .month-nav a:hover { background:#fff0f3; color:var(--pri); }

  .month-card {
    background:var(--card); border-radius:5px; padding:20px 22px;
    box-shadow:0 10px 30px rgba(43,45,66,.08); margin-bottom:16px;
    scroll-margin-top:64px;
  }
  .month-title { display:flex; align-items:baseline; justify-content:space-between;
                 font-size:21px; font-weight:600; margin:0 0 10px; }
  .month-count { font-size:16px; color:var(--sub); font-weight:400; }

  .day-row { padding:11px 0; border-bottom:1px solid var(--line); }
  .day-row:last-child { border-bottom:none; }
  .day-date { display:block; font-weight:550; font-size:var(--fs-meta); color:var(--text);
              margin-bottom:2px; }
  .day-date.today { color:var(--pri); }
  .today-tag { display:inline-block; font-size:14px; font-weight:500; color:var(--pri);
               background:#fff0f3; border-radius:2px; padding:1px 7px; margin-left:4px; }

  /* 同一天多人的纵向排布 */
  .day-people { display:flex; flex-direction:column; gap:10px; min-width:0; }
  .person { display:inline-flex; align-items:center; gap:8px; font-size:var(--fs-body); line-height:1.45; }
  .person-info { display: flex; flex-direction:column; min-width:0; }
  .person-name { font-weight:600; font-size:22px; line-height:1.28; }
  .person-meta { font-size:var(--fs-meta); color:var(--sub); line-height:1.35;
                 display:flex; flex-direction:column; gap:0;
                 overflow-wrap:anywhere; }

  /* 头像 */
  .avatar {
    width:60px; height:60px; display:inline-flex; font-size:14px;
  }

  .empty-month { color:var(--sub); font-size:16px; padding:6px 0 2px; }

  @media (max-width:520px) {
    .month-card { padding:18px; }
    .day-date { font-size:16px; }
  }
</style>
</head>
<body>
<div class="page">
  <header class="site-head">
    <nav class="site-nav" aria-label="页面导航">
      <a href="./index.html">最近生日</a>
      <a href="./calendar.html">生日日历</a>
      <a href="./all_birthdays.html" aria-current="page">全年一览</a>
    </nav>
    <div id="birthdayFilters"></div>
  </header>

  <h1>全年生日一览</h1>

  <nav class="month-nav" id="monthNav"></nav>
  <div id="months"></div>

</div>

<!-- 数据源 -->
<script src="./birthdays.js"></script>
<script src="./birthday-core.js"></script>
<script src="./birthday-filter.js"></script>
<script>
const Core = window.BirthdayCore;
const escapeHTML = Core.escapeHTML;

let todayMonth;
let todayDay;
let monthMap = new Map();

function syncToday() {
  const today = Core.nowInChina();
  todayMonth = today.getUTCMonth() + 1;
  todayDay = today.getUTCDate();
}

function buildMonthMap(subjects) {
  const map = new Map();

  subjects.forEach(person => {
    const birthday = Core.parseBirthday(person.birthday);
    if (!birthday) return;

    if (!map.has(birthday.month)) map.set(birthday.month, new Map());
    const dayMap = map.get(birthday.month);
    if (!dayMap.has(birthday.day)) dayMap.set(birthday.day, []);
    dayMap.get(birthday.day).push(person);
  });

  map.forEach(dayMap => {
    dayMap.forEach(list => list.sort(Core.byName));
  });

  return map;
}

function daysOf(month) {
  const dayMap = monthMap.get(month);
  if (!dayMap) return [];
  return [...dayMap.keys()].sort((a, b) => a - b);
}

function renderMonthNav() {
  const nav = document.getElementById("monthNav");
  const months = [...monthMap.keys()].sort((a, b) => a - b);
  nav.innerHTML = months.map(m => `<a href="#m-${m}">${m}月</a>`).join("");
}

function renderMonths() {
  const box = document.getElementById("months");
  const months = [...monthMap.keys()].sort((a, b) => a - b);

  if (!months.length) {
    box.innerHTML = `<div class="month-card"><p class="empty-month">暂无生日数据</p></div>`;
    return;
  }

  box.innerHTML = months.map(m => {
    const days = daysOf(m);
    const count = days.reduce((n, d) => n + monthMap.get(m).get(d).length, 0);

    const rows = days.map(d => {
      const people = monthMap.get(m).get(d);
      const isToday = m === todayMonth && d === todayDay;

      const peopleHtml = people.map(p => {
        const meta = Core.subjectMetaHTML(p, { includeAge: false });
        return `<span class="person">
          ${Core.avatarHTML(p)}
          <span class="person-info">
            <span class="person-name">${escapeHTML(p.name)}</span>
            ${meta ? `<span class="person-meta">${meta}</span>` : ""}
          </span>
        </span>`;
      }).join("");

      return `<div class="day-row">
        <div class="day-date${isToday ? " today" : ""}">
          ${m}月${d}日${isToday ? `<span class="today-tag">今天</span>` : ""}
        </div>
        <div class="day-people">${peopleHtml}</div>
      </div>`;
    }).join("");

    return `<section class="month-card" id="m-${m}">
      <h2 class="month-title">
        <span>${m}月</span>
        <span class="month-count">${count} 位</span>
      </h2>
      ${rows}
    </section>`;
  }).join("");
}

function renderPage() {
  Core.resetAvatars();
  syncToday();
  monthMap = buildMonthMap(window.BirthdayFilters.getSubjects());
  renderMonthNav();
  renderMonths();
}

window.BirthdayFilters.subscribe(renderPage);
renderPage();
Core.scheduleChinaMidnightRefresh(renderPage);
</script>
</body>
</html>
